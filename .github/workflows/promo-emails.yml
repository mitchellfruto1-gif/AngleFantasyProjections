name: Promo emails

# Emails ready-to-post promo images with suggested text.
#   Daily (every morning): top 10 performers of the night (9-cat and points), the Angle Market's 5 buy lows and
#     5 sell highs with each player's Market card PNG, and on Wed (punt impact) / Thu (what didn't change) that day's Monday-changelog post.
#   Weekly (Monday morning): saves the encrypted Monday snapshot (data/monday/), then the 4-post ANGLE MONDAY UPDATE
#     thread with its header / risers / fallers images, plus the top 25 of the week and the Market movers.
#   Snapshot (Run workflow only): saves a snapshot and sends nothing; run it once to start the Monday-to-Monday diff.
# Nothing is posted to X: everything arrives by email for review.
# Runs after the 11:00 UTC daily data update. The recipient, Gmail login and access code are repository
# secrets, so none of them appear in this public file or its logs.
on:
  schedule:
    - cron: "30 13 * * *"   # every day, about 6:30 AM Pacific
    - cron: "45 13 * * 1"   # Mondays, about 6:45 AM Pacific
  workflow_dispatch:
    inputs:
      mode:
        description: "Which email to send"
        type: choice
        options: [daily, weekly, snapshot]
        default: daily

permissions:
  contents: write   # commits the encrypted Monday snapshot

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Pick daily or weekly
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "45 13 * * 1" ]; then mode="weekly"
          else mode="daily"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Serve the site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      - name: Make the promo images
        id: shots
        shell: pwsh
        env:
          ANGLE_CODE: ${{ secrets.ANGLE_CODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          MONDAY_SAFE: ${{ vars.MONDAY_SAFE }}   # "true" = posts name only players in the free top 25 (default: full ranks)
        run: ./scripts/promo_shots.ps1 -Mode ${{ steps.mode.outputs.mode }} -Site "$env:SITE_URL"

      - name: Save the Monday snapshot
        if: steps.mode.outputs.mode != 'daily'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/monday
          if git diff --cached --quiet; then echo "No new snapshot."; else
            git commit -m "Monday snapshot: $(date -u +%Y-%m-%d)"; git pull --rebase; git push; fi

      - name: Email them
        if: steps.shots.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Angle promo bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.shots.outputs.subject }}
          html_body: file://promo-out/email.html
          attachments: promo-out/*.png
