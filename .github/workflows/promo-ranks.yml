name: Promo ranks
run-name: "Promo ranks: ${{ inputs.cards || 'today' }}"

# Emails a ready-to-post "real rank" promo image (or two) every morning, with suggested post text. Every image carries the
# website name in its footer. The cards use real season-to-date production from history.json (updated by the 11:00 UTC
# data job), ranked the same way as the site's Real view. One theme per weekday so the feed stays varied:
#   Mon  Risers & fallers, 9-cat and points (real rank now vs the end of last week)
#   Tue  Rookie check-in (real 9-cat rank, real points rank, per-game stats)
#   Wed  Injury report (the biggest names who are out, with return dates; no ranks)
#   Thu  Category leaders (per-game leaders in all 9 categories)
#   Fri  Fantasy playoff schedules (best and toughest, from the Schedule tab)
#   Sat  Dynasty risers and fallers (November vs July)
#   Sun  Next week's schedule (games per team, low-volume nights; from the Schedule tab) + Angle Market sector report
# No preseason numbers in any card (they're outdated), so the old Preseason vs. reality card was retired (2026-11-11).
# Run it by hand to pick the cards (comma list: rookies, movers-cat, movers-pts, leaders, sched-week,
# sched-playoffs, injuries, dynasty-movers, sectors; empty = today's).
# Nothing is posted to X: everything arrives by email for review. The recipient, Gmail login and access code are
# repository secrets, so none of them appear in this public file or its logs.
on:
  schedule:
    - cron: "15 14 * * *"   # every day, about 7:15 AM Pacific, after the 11:00 UTC data update
  workflow_dispatch:
    inputs:
      cards:
        description: "Cards to send (comma list). Empty = today's theme."
        type: string
        default: ""
      auto:
        description: "Started by the website's timer (skips if this email already went out today). Leave off."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read     # the guard job looks for an earlier run today

concurrency:
  group: promo-ranks
  cancel-in-progress: false

jobs:
  # Started by GitHub's schedule or by the website's timer (Cloudflare, input auto)? Then skip when today's cards already
  # went out in the last 14 hours: GitHub's schedule can run hours late, after the timer's run has sent them. Runs you
  # start yourself (Run workflow) always send.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - name: Did today's cards already go out?
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto == true }}
          WF: promo-ranks.yml
        run: |
          if [ "$AUTO" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          me=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .display_title)
          since=$(date -u -d '-14 hours' +%FT%TZ)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs" -f created=">=$since" -f per_page=50 \
            --jq "[.workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .display_title == \"$me\" and (.conclusion == \"success\" or .status == \"in_progress\"))] | length")
          echo "Earlier runs in the last 14 hours titled '$me': $n"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  ranks:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Pick today's cards
        id: pick
        env:
          CARDS: ${{ inputs.cards }}
        run: |
          if [ -n "$CARDS" ]; then cards="$CARDS"; else
            case "$(TZ=America/Los_Angeles date +%u)" in
              1) cards="movers-cat,movers-pts" ;;
              2) cards="rookies" ;;
              3) cards="injuries" ;;
              4) cards="leaders" ;;
              5) cards="sched-playoffs" ;;
              6) cards="dynasty-movers" ;;
              7) cards="sched-week,sectors" ;;
            esac
          fi
          echo "cards=$cards" >> "$GITHUB_OUTPUT"

      - name: Serve the site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      - name: Make the promo images
        id: shots
        shell: pwsh
        env:
          ANGLE_CODE: ${{ secrets.ANGLE_CODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          CARDS: ${{ steps.pick.outputs.cards }}
        run: ./scripts/promo_shots.ps1 -Mode board -Only "$env:CARDS" -Site "$env:SITE_URL"

      - name: Email them
        if: steps.shots.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Angle promo bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.shots.outputs.subject }}
          html_body: file://promo-out/email.html
          attachments: promo-out/*.png

      - name: Email the failure notice
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Angle promo bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Angle promo FAILED: Promo ranks (${{ steps.pick.outputs.cards }})"
          html_body: "<p>The promo run did not finish, so nothing was sent for it.</p><p>The log shows the step that failed and why: <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>open the run</a>. You can run it again from the Actions tab (Run workflow).</p>"
