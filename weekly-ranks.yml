name: Daily fantasy ranks

# Every morning at 09:00 UTC (5 AM Eastern in season), after the previous night's games are final.
# Real / Blend ranks update daily; the Trend graphs add a point when each fantasy week (Mon-Sun) completes.
# Also runs on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ranks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull box scores, rebuild weekly ranks, refresh schedule
        shell: pwsh
        run: ./scripts/update_history.ps1

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add history.json schedule.json data/games.csv
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily ranks: $(date -u +%Y-%m-%d)"
            git push
          fi
